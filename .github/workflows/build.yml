# Покласти в репозиторій як: .github/workflows/build.yml
name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          [ -n "$ZIP" ] || { echo "У корені репозиторію немає .zip з проєктом"; exit 1; }
          rm -rf _proj && mkdir _proj && unzip -q "$ZIP" -d _proj
          SETTINGS=$(find _proj -maxdepth 3 -name settings.gradle.kts | head -n1)
          [ -n "$SETTINGS" ] || { echo "settings.gradle.kts не знайдено в zip"; exit 1; }
          echo "PROJ_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VN="${GITHUB_REF_NAME#v}"; else VN="0.3.0-dev${{ github.run_number }}"; fi
          echo "VN=$VN" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace -PversionName="$VN" -PversionCode=${{ github.run_number }}

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$PROJ_DIR"/app/build/outputs/apk/release/*.apk "dist/MUSKUP-$VN.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MUSKUP-${{ env.VN }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
